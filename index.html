<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring LOB Champion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --glass-bg: rgba(30, 41, 59, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-card: rgba(15, 23, 42, 0.55);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 50%, #e2e8f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-card: rgba(255, 255, 255, 0.5);
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent: #4f46e5;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: all 0.3s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .glass-card {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-active {
            background-color: rgba(99, 102, 241, 0.3) !important;
            color: #818cf8 !important;
            border: 1px solid rgba(99, 102, 241, 0.4) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <aside id="sidebar" class="w-full md:w-64 glass-panel m-2 p-4 flex flex-col justify-between shrink-0 z-20 transition-all duration-300">
        <div>
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-600 rounded-lg text-white">
                        <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">LOB Champion</h1>
                        <p class="text-xs text-indigo-400 font-medium">Monitoring Dashboard</p>
                    </div>
                </div>
            </div>

            <nav class="space-y-2" id="sidebar-nav">
                <button onclick="showSection('overview')" id="btn-overview" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-white/5 transition nav-active">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview KPI
                </button>
                <button onclick="showSection('store-perf')" id="btn-store-perf" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-white/5 transition">
                    <i data-lucide="store" class="w-4 h-4"></i> Performance Store
                </button>
                <button onclick="showSection('compliance')" id="btn-compliance" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-white/5 transition">
                    <i data-lucide="calendar-check" class="w-4 h-4"></i> Matriks Kedisiplinan
                </button>
                <button onclick="showSection('raw-data')" id="btn-raw-data" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-white/5 transition">
                    <i data-lucide="database" class="w-4 h-4"></i> Data Transaksi
                </button>
            </nav>
        </div>

        <div class="pt-4 border-t border-white/10 space-y-3">
            <button onclick="fetchLiveData()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/30">
                <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4"></i> Live Sync Data
            </button>

            <button onclick="toggleTheme()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg glass-card text-sm font-medium hover:bg-white/10 transition">
                <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i>
                <span id="theme-text">Mode Gelap</span>
            </button>

            <div class="p-2.5 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-center">
                <p class="text-[10px] opacity-70 tracking-wide uppercase font-semibold">Created & Designed by</p>
                <p class="text-xs font-bold text-indigo-400 mt-0.5">Novi Riyanto</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 m-2 md:m-3 flex flex-col gap-4 overflow-hidden">

        <header class="glass-panel p-4 flex flex-wrap items-center justify-between gap-4">
            <div>
                <h2 class="text-xl font-bold" id="page-title">Executive Overview</h2>
                <p class="text-xs opacity-70 flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Terakhir diperbarui: <span id="last-update" class="font-semibold">Memuat...</span>
                </p>
            </div>

            <div class="flex flex-wrap items-center gap-3 text-xs">
                <div>
                    <label class="block opacity-60 mb-1">Filter LOB</label>
                    <select id="filter-lob" onchange="applyFilters()" class="bg-slate-900/50 border border-white/10 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="ALL">Semua LOB</option>
                    </select>
                </div>
                <div>
                    <label class="block opacity-60 mb-1">Filter Shift</label>
                    <select id="filter-shift" onchange="applyFilters()" class="bg-slate-900/50 border border-white/10 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="ALL">Semua Shift</option>
                    </select>
                </div>
                <div>
                    <label class="block opacity-60 mb-1">Filter Position</label>
                    <select id="filter-position" onchange="applyFilters()" class="bg-slate-900/50 border border-white/10 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="ALL">Semua Jabatan</option>
                    </select>
                </div>
            </div>
        </header>

        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium opacity-70">Total Unit Terjual</p>
                    <h3 class="text-2xl font-bold mt-1 text-indigo-400" id="kpi-total-qty">0</h3>
                </div>
                <div class="p-3 bg-indigo-500/10 rounded-xl border border-indigo-500/20 text-indigo-400">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="glass-card p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium opacity-70">Total Laporan Masuk</p>
                    <h3 class="text-2xl font-bold mt-1 text-emerald-400" id="kpi-total-reports">0</h3>
                </div>
                <div class="p-3 bg-emerald-500/10 rounded-xl border border-emerald-500/20 text-emerald-400">
                    <i data-lucide="file-check" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="glass-card p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium opacity-70">Champion Aktif</p>
                    <h3 class="text-2xl font-bold mt-1 text-amber-400" id="kpi-active-champions">0</h3>
                </div>
                <div class="p-3 bg-amber-500/10 rounded-xl border border-amber-500/20 text-amber-400">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="glass-card p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium opacity-70">Store Berpartisipasi</p>
                    <h3 class="text-2xl font-bold mt-1 text-sky-400" id="kpi-total-stores">0</h3>
                </div>
                <div class="p-3 bg-sky-500/10 rounded-xl border border-sky-500/20 text-sky-400">
                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                </div>
            </div>
        </section>

        <div class="flex-1 overflow-y-auto pr-1 space-y-4">

            <div id="sec-overview" class="content-section space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel p-4 md:col-span-2 flex flex-col justify-between">
                        <h3 class="font-bold text-sm flex items-center gap-2 mb-4">
                            <i data-lucide="smartphone" class="w-4 h-4 text-indigo-400"></i> Total Penjualan per Kategori LOB
                        </h3>
                        <div class="h-64 relative"><canvas id="chartLOB"></canvas></div>
                    </div>
                    <div class="glass-panel p-4 flex flex-col justify-between">
                        <h3 class="font-bold text-sm flex items-center gap-2 mb-4">
                            <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i> Penjualan per Shift
                        </h3>
                        <div class="h-64 relative flex items-center justify-center"><canvas id="chartShift"></canvas></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel p-4 md:col-span-2 flex flex-col justify-between">
                        <h3 class="font-bold text-sm flex items-center gap-2 mb-4">
                            <i data-lucide="trophy" class="w-4 h-4 text-emerald-400"></i> Top Store Performa Tertinggi
                        </h3>
                        <div class="h-64 relative"><canvas id="chartStoresOverview"></canvas></div>
                    </div>
                    <div class="glass-panel p-4 flex flex-col justify-between">
                        <h3 class="font-bold text-sm flex items-center gap
