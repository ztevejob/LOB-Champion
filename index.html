<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Retail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        lightBg: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <style>
        /* Penyesuaian Mode Gelap (Font Neon/Lebih Cerah) */
        .dark body {
            background-color: #0f172a;
            color: #38bdf8; /* Biru neon cerah */
        }
        .dark .text-custom {
            color: #4ade80 !important; /* Hijau neon cerah */
        }
        .dark .card-bg {
            background-color: #1e293b;
            border: 1px solid #334155;
        }

        /* Penyesuaian Mode Terang (Font Lebih Gelap) */
        body {
            background-color: #f8fafc;
            color: #0f172a; /* Sangat gelap */
        }
        .text-custom {
            color: #1e293b !important;
        }
        .card-bg {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
        }

        /* Handler otomatis latar belakang gelap jika font terdeteksi putih pada mode terang */
        :not(.dark) .force-dark-bg-if-white {
            background-color: #0f172a !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="transition-colors duration-300 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Kontrol Mode -->
        <div class="flex justify-between items-center card-bg p-4 rounded-xl shadow-md">
            <div>
                <h1 class="text-xl font-bold text-custom">Dashboard Retail & Pembaruan</h1>
                <p class="text-sm opacity-90">Terakhir diperbarui: 2 Sep 2026, 19.16 WIB (Auto Sync Aktif)</p>
            </div>
            <button onclick="toggleDarkMode()" class="px-4 py-2 rounded-lg bg-sky-600 text-white font-medium hover:bg-sky-500 transition">
                Ubah Mode
            </button>
        </div>

        <!-- Contoh Konten Kartu -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="card-bg p-5 rounded-xl shadow">
                <h2 class="font-semibold text-lg mb-2 text-custom">Status Sinkronisasi</h2>
                <p class="text-sm opacity-90">Sistem melakukan sinkronisasi data secara berkala setiap 5 menit.</p>
            </div>
            
            <!-- Contoh elemen dengan fallback background gelap jika memaksa font putih di mode terang -->
            <div class="card-bg p-5 rounded-xl shadow force-dark-bg-if-white">
                <h2 class="font-semibold text-lg mb-2">Elemen Khusus</h2>
                <p class="text-sm">Kotak ini otomatis berlatar belakang gelap agar teks putih tetap terbaca kontras pada mode terang.</p>
            </div>
        </div>

    </div>

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
            }
        }
    </script>
</body>
</html>
